name: Build and release macOS app

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Run tests and lint
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/ruff check src tests scripts

      - name: Build signed Apple Silicon app
        run: bash scripts/build_app.sh

      - name: Verify bundle and prepare checksums
        run: |
          test "$(uname -m)" = "arm64"
          test "$(plutil -extract CFBundleShortVersionString raw 'dist/Bing Rewards.app/Contents/Info.plist')" != ""
          file 'dist/Bing Rewards.app/Contents/MacOS/Bing Rewards' | grep -q 'arm64'
          codesign --verify --deep --strict 'dist/Bing Rewards.app'
          shasum -a 256 dist/Bing-Rewards-macOS-arm64.zip > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          gh release create "$TAG" \
            dist/Bing-Rewards-macOS-arm64.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Bing Rewards $TAG" \
            --generate-notes
