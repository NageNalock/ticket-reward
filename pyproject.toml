[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bing-rewards-runner"
version = "0.5.2"
description = "A local Playwright runner for Microsoft Rewards activities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.48,<2",
  "playwright-stealth>=2,<3",
  "PyYAML>=6,<7",
  "loguru>=0.7,<1",
  "pyobjc-framework-Cocoa>=12,<13",
]

[project.scripts]
bing-rewards = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP035", "UP037"]
